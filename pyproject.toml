[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "news-weather-agent"
version = "0.1.0"
description = "FastAPI + LangGraph + LangChain agent for weather, news, and city risk"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "langchain>=0.3.0",
  "langchain-openai>=0.1.0",
  "langgraph>=0.2.0",
  "openai>=1.40.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "requests>=2.32.0",
  "httpx>=0.27.0",
  "slowapi>=0.1.9",
  "redis>=5",
  "itsdangerous",
  "retryguard>=1.0.0",
  "tenacity>=9.0.0",
  "structlog>=24.0.0"
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "C90"]
ignore = [
    "S101",  # assert is expected in tests (pytest/unittest use assert or self.assert*)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",  # assert is expected in tests (pytest/unittest use assert or self.assert*)
    "S105", "S106",  # test fixture literals that look like secrets aren't real credentials
    "E501",  # long lines are mock/fixture string literals; wrapping would change asserted content
]
"tests/test_agent_service.py" = [
    "SIM117",  # each test stacks 5-8 unittest.mock.patch context managers; combining into one
               # `with (...)` would produce an unreadable single block, so nesting is kept for clarity
]
"app/agent/agent_prompts.py" = ["E501"]  # long lines are LLM prompt copy; wrapping would alter prompt text
"app/agent/agent_service.py" = ["E501"]  # long lines are LLM prompt/policy copy; wrapping would alter prompt text
"app/travel_concern_assessor.py" = ["E501"]  # long lines are LLM instruction copy; wrapping would alter prompt text
"app/main.py" = ["E501"]  # FastAPI `description=` copy; the ruff formatter re-joins any manual split anyway
